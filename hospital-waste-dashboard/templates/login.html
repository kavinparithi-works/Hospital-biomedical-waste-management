{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 glass-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="logo-icon mb-3">
                        <i class="fa-solid fa-biohazard fa-3x text-danger"></i>
                    </div>
                    <h2 class="fw-bold">BioWaste Tracker</h2>
                    <p class="text-muted">Secure AI Compliance & Audit System</p>
                </div>
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3 form-floating">
                        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="name@example.com" value="admin@hospital.com" required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="mb-4 form-floating">
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Password" value="password" required>
                        <label for="password">Password</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-semibold shadow-sm gradient-btn">
                            <i class="fa-solid fa-lock me-2"></i> Secure Login
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4 text-muted small">
                    <p>Demo Credentials: <b>admin@hospital.com / password</b></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
